[package]
name = "fixus"
version = "0.1.0"
edition = "2021"
description = "Agent Session Event Store — 不可变事件存储与可靠执行运行时"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# logdbd — append-only log database (gRPC + SQL query cache)
logdb-client = { path = "../../logdb/lv-logdb/logdb-client", features = ["broker"] }
logdb-broker-proto = { path = "../../logdb/lv-logdb/logdb-broker-proto" }
tonic = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["v7", "v4", "serde"] }

# Error handling
thiserror = "2"
async-trait = "0.1"

# HTTP client (sandbox client)
reqwest = { version = "0.12", features = ["json"] }

# CLI (sandbox-server)
clap = { version = "4", features = ["derive"] }

# WebSocket client (fixlet → fixus)
tokio-tungstenite = "0.29"

# WebSocket utilities
futures-util = "0.3"

# Hashing (idempotency_key)
sha2 = "0.10"
hex = "0.4"

# Config — Operator policy TOML parsing (Phase 1 sandbox boundary)
toml = "0.8"

# Streaming — fixus-stream SSE 网关 + token 逐字流式(Redis ephemeral 快路径)
redis = { version = "0.31", features = ["tokio-comp", "aio", "connection-manager"] }
tokio-stream = "0.1"

# Sandbox (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.4"  # bash net-off kernel filter (Phase 1 sandbox boundary)

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metrics — 业务 Prometheus 指标(CR-4)
prometheus = "0.13"

[dev-dependencies]
tokio-test = "0.4"
serde_json = "1"
http-body-util = "0.1"
# 集成测试:内嵌真实 logdbd(含 Indexer 后台线程)验证 EventStore 契约
logdbd = { path = "../../logdb/lv-logdb/logdbd" }
logdbd-proto = { path = "../../logdb/lv-logdb/logdbd-proto" }
logdb-broker = { path = "../../logdb/lv-logdb/logdb-broker" }
logdb = { path = "../../logdb/lv-logdb/logdb" }
tempfile = "3"

[[bin]]
name = "fixus"
path = "src/main.rs"

[[bin]]
name = "fixlet"
path = "src/bin/fixlet/main.rs"

[[bin]]
name = "sandbox-server"
path = "src/bin/sandbox-server/main.rs"

[[bin]]
name = "tools-bank"
path = "src/bin/tools-bank/main.rs"

[[bin]]
name = "fixus-stream"
path = "src/bin/fixus-stream/main.rs"
